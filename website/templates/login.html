{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-lg" style="background: rgba(255, 240, 242, 0.95); border-radius: 16px; position: relative; overflow: hidden; border: 1px solid rgba(220, 53, 69, 0.2) !important;">

      <div style="position: absolute; top: 12px; right: -30px; width: 110px; height: 24px; background: #dc3545; transform: rotate(35deg); box-shadow: 0 2px 6px rgba(0,0,0,0.15); pointer-events: none;"></div>

      <div class="card-body p-4 p-sm-5">
        <h2 class="text-center mb-4 fw-bold" style="color: #8b0000;">Login</h2>

        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold" style="color: #660000;">Email Address</label>
            <input
              type="email"
              class="form-control form-control-lg"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            >
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold" style="color: #660000;">Password</label>
            <input
              type="password"
              class="form-control form-control-lg"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            >
          </div>

          <button type="submit" class="btn w-100 py-2 fs-5 fw-bold text-white" style="background-color: #dc3545; border: none; border-radius: 8px;">
            Login
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="mb-0" style="color: #772222;">
            Don't have an account? <a href="/sign-up" class="fw-bold" style="color: #dc3545;">Sign Up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
