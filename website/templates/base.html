<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Notes{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      /* Matching warm reddish-pink gradient background */
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Main container wrapper with matching reddish card styling */
    .content-wrapper {
      background: rgba(255, 221, 225, 0.6);
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(220, 53, 69, 0.2);
      box-shadow: 0 8px 20px rgba(220, 53, 69, 0.1);
      position: relative;
    }

    /* Untied ribbon decoration - Top Left of Content */
    .content-wrapper::before {
      content: "";
      position: absolute;
      top: -15px;
      left: -25px;
      width: 120px;
      height: 30px;
      background: #dc3545; /* Red ribbon strip */
      transform: rotate(-25deg);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      z-index: 10;
      pointer-events: none;
    }

    /* Untied ribbon decoration - Top Right of Content */
    .content-wrapper::after {
      content: "";
      position: absolute;
      top: -15px;
      right: -25px;
      width: 120px;
      height: 30px;
      background: #c82333; /* Darker red ribbon strip */
      transform: rotate(25deg);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      z-index: 10;
      pointer-events: none;
    }

    /* Reddish note cards styling */
    .note-item {
      background-color: #fff0f2 !important;
      border-radius: 12px !important;
      border: 1px solid rgba(220, 53, 69, 0.25);
    }

    /* Reddish input form controls */
    .form-control {
      border-radius: 8px;
      background-color: #fff0f2;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .form-control:focus {
      background-color: #ffffff;
      border-color: #dc3545;
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="My Notes Logo"
          width="30"
          height="30"
          style="object-fit: contain;"
        >
        <span>My Notes</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbar">
        <div class="navbar-nav ms-auto">
          <a class="nav-item nav-link active" href="/">Home</a>
          <a class="nav-item nav-link" href="/logout">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="content-wrapper">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function deleteNote(noteId) {
      fetch("/delete-note", {
        method: "POST",
        body: JSON.stringify({ noteId: noteId }),
        headers: {
          "Content-Type": "application/json"
        }
      }).then((_res) => {
        window.location.href = "/";
      });
    }
  </script>
</body>
</html>
